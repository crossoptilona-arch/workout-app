<style>

<div class="wrap">

    </div>
    <h1>Strength <em>rebuild.</em></h1>
    <div class="head-row" style="align-items:center;margin-bottom:6px;">
      <span class="week-label" id="weekLabel"></span>
    </div>
    <div class="week-strip" id="weekStrip"></div>
    <div class="week-nav" id="weekNav"></div>
  </header>
  <main id="main"></main>
</div>
 
<div class="timer-bar">
  <div class="timer-inner">
    <div class="timer-digits" id="timerDigits">0:00</div>

    </div>

<script>
"use strict";
 
// ============ CONFIG ============
const BLOCK_START = new Date(2026, 6, 2); // Jul 2 2026, week 1 anchor
const REST = { compound: 120, explosive: 90, accessory: 60, grip: 60, core: 45, hang: 60 };
 
const WEEK_META = [
  { rpe: "6-7", reps: "8-10", sets: 3, note: "Groove the patterns. Leave 3+ reps in the tank. Log everything.", deload: false },
  { rpe: "7-8", reps: "8",    sets: 3, note: "Add load only where Week 1 hit all reps at RPE \u22648.", deload: false },
  { rpe: "8",   reps: "6-8",  sets: 3, note: "Last set near-failure with clean form. This is the hard week.", deload: false },
  { rpe: "5-6", reps: "8-10", sets: 2, note: "Deload. Drop load 15-20%, 2 sets not 3. Non-negotiable recovery.", deload: true }
];
 
// helper to build a strength exercise
function ex(code, name, cat, repsOverride, start, cue, prog, opts) {
  opts = opts || {};
  return { code, name, cat, rest: REST[cat], reps: repsOverride || null, start, cue, prog,
           isNew: !!opts.isNew, type: opts.type || "lift", perSide: !!opts.perSide };
}
 
// ============ WARM-UPS (timed, day-specific, non-impact, back-safe) ============
const WU_MON = [
  ["Easy flat walk or bike", "90s"],
  ["Ankle dorsiflexion rocks, 8/side", "45s"],
  ["Bodyweight deep squat, 6 reps, 2s pause", "45s"],
  ["Band hip hinge, 10 reps", "45s"],
  ["Band pull-apart x12 + pass-through x8", "60s"],
  ["Dead bug, 4/side", "30s"],
  ["Easy dead hang, 1 set", "20s"]
];
const WU_WED = [
  ["Easy flat walk or bike", "90s"],
  ["Ankle rocks 8/side + single-leg balance 20s/side", "60s"],
  ["Single-leg hip hinge (airplane), 6/side", "45s"],
  ["Bodyweight reverse lunge in place, 6/side", "45s"],
  ["Band pull-apart x12 + wall slides x8", "45s"],
  ["Scapular push-up, 8 reps", "30s"],
  ["Dead bug, 4/side", "30s"]
];
const WU_FRI = [
  ["Easy flat walk or bike", "90s"],
  ["Ankle dorsiflexion rocks, 8/side", "45s"],
  ["Bodyweight deep squat to stand, 6 reps", "45s"],
  ["Band hip hinge, 10 reps", "45s"],
  ["Band pull-apart x12 + pass-through x8", "60s"],
  ["Scapular push-up x8 + scapular pulls on bar x5", "60s"],
  ["Dead bug, 4/side", "30s"]
];
const WU_MIN = { mon: 6, wed: 6, fri: 6 };
 
// ============ STRENGTH SESSIONS ============
const MON = {
  key: "mon", type: "strength", label: "Strength A",
  focus: "Squat · Row · Press", warmup: WU_MON, wuMin: WU_MIN.mon,
  hang: { title: "Dead Hang — Test", scheme: "3 \u00d7 max hold (cap 15s W1)", sets: 3, rest: REST.hang },
  ex: [
    ex("gsq", "Goblet Squat", "compound", null, "30 lb", "Drive through heel and midfoot, never the ball of the foot. Brace before you descend, 1s pause at bottom.", "+5 lb next session if all sets hit reps at target RPE."),
    ex("row", "Bent-Over Row", "compound", null, "20 lb/hand", "Set a neutral spine and lock it. Move at the hip, pull to the lower ribs. If the low back rounds, stop.", "+5 lb next session if all sets clean."),
    ex("cp", "DB Chest Press", "compound", null, "25 lb each", "Shoulder blades pinned to the bench, elbows at 45\u00b0, full lockout without flaring.", "+2.5 lb each side if all sets at target RPE."),
    ex("lr", "Lateral Raise", "accessory", "10-12", "8 lb each", "Lead with the elbows, thumbs slightly down, stop at shoulder height. No shrug, no swing.", "+2.5 lb when top reps feel controlled."),
    ex("bc", "Bicep Curl", "accessory", "10", "15 lb each", "Elbows pinned to your sides, control the lower for 2s. No body english.", "+2.5 lb when all reps clean at RPE \u22648."),
    ex("fp", "Band Face Pull", "accessory", "15", "Light-medium band", "Pull to the eyes, elbows high and wide, squeeze the rear delts 1s. Posture work, keep it strict.", "Shorten the band / step back when 15 feels easy.", { isNew: true }),
    ex("sw", "DB Swing", "explosive", "10", "25 lb", "Snap the hips, ribs stay down, spine neutral. A hip action, not a low-back lift. Float, don't lift.", "+5 lb when the snap stays crisp for all reps."),
    ex("cr", "Seated DB Calf Raise", "accessory", "12-15", "20 lb on knees", "Full stretch at the bottom, 1s squeeze at the top. Push through the whole ball evenly. Stop on any neuroma buzz.", "+5 lb when 15 reps feel strong and pain-free.", { isNew: true }),
    ex("db", "Dead Bug", "core", "8-10", "Bodyweight or 5 lb", "Low back pinned flat the entire time. Opposite arm and leg, slow. If the back lifts, shorten the range.", "Add light DB when 10/side stays pinned.", { perSide: true })
  ],
  finisher: "7 min circuit: DB swing x10 / bench push-up x8 / mountain climber x20. Rounds for the clock, easy transitions."
};
 
const WED = {
  key: "wed", type: "strength", label: "Strength B",
  focus: "Lunge · Hinge · Push", warmup: WU_WED, wuMin: WU_MIN.wed,
  hang: { title: "Dead Hang — Volume", scheme: "4 \u00d7 12s submax", sets: 4, rest: REST.hang },
  ex: [
    ex("rl", "Reverse Lunge", "compound", "8", "20 lb", "Lower straight down, soft and silent back-foot touch, no push-off. Weight through the front heel.", "+5 lb when both sides hit all reps at target RPE.", { perSide: true }),
    ex("slrdl", "Single-Leg RDL", "compound", "8-10", "15 lb each", "Neutral spine locked, hinge from the standing hip. Slow, balance-led. Back rounds means too far.", "+2.5 lb/side when balance is solid for all reps.", { perSide: true }),
    ex("bc2", "Bicep Curl", "accessory", "10", "15 lb each", "Elbows pinned, 2s lower. Match or beat Monday's load.", "+2.5 lb when clean at RPE \u22648."),
    ex("rf", "Reverse Fly", "accessory", "12-15", "8 lb each", "Slight hip hinge, flat back, lead with the pinkies, squeeze the rear delts. Light and strict.", "+2.5 lb when top reps stay controlled."),
    ex("epu", "Explosive Push-Up (bench)", "explosive", "6-8", "Hands on bench", "Lower under control, drive up fast enough that the hands leave the bench. Elbows 45\u00b0, body in one line.", "Lower the bench height when reps stay explosive."),
    ex("pp", "Pallof Press", "core", "10", "Medium band", "Press straight out, resist the twist. Ribs down, glutes on. This is anti-rotation, don't rush.", "Shorten the band when you can hold rock-steady.", { perSide: true }),
    ex("fc", "Farmer Carry", "grip", "30-40s", "25-30 lb/hand", "Shoulders packed, tall spine, deliberate steps. Grip work, so no straps here.", "+5 lb/hand when 40s feels easy.")
  ],
  finisher: "Suitcase carry: 4 \u00d7 30s/side. Heavy-ish, anti-lateral-flexion, stay tall."
};
 
const FRI = {
  key: "fri", type: "strength", label: "Strength C",
  focus: "Squat · Hinge · Dip", warmup: WU_FRI, wuMin: WU_MIN.fri,
  hang: { title: "Dead Hang — Active Scapular Pull", scheme: "3 \u00d7 10s, shoulders active", sets: 3, rest: REST.hang },
  ex: [
    ex("gsq2", "Goblet Squat", "compound", null, "30 lb", "Heel and midfoot drive, brace, 1s pause. Same groove as Monday.", "+5 lb if Monday's sets were clean at target RPE."),
    ex("row2", "Bent-Over Row", "compound", null, "20 lb/hand", "Neutral spine locked, hip-hinged, pull to lower ribs. No low-back movement.", "+5 lb if all sets clean."),
    ex("rdl", "DB RDL", "compound", null, "25 lb each", "Neutral spine, push the hips back, DBs graze the thighs. The hamstrings stretch, the back stays still.", "+5 lb when all reps hit target RPE. Straps if grip limits above 30 lb/hand."),
    ex("lr2", "Lateral Raise", "accessory", "10-12", "8 lb each", "Elbows lead, stop at shoulder height, no shrug.", "+2.5 lb when controlled."),
    ex("bd", "Bench Dip", "accessory", "8-10", "Bodyweight", "Shoulders down and back, elbows track straight back. Only descend to where the shoulders stay comfortable.", "Add feet-elevated or a DB in the lap when 10 feels easy."),
    ex("fp2", "Band Face Pull", "accessory", "15", "Light-medium band", "Pull to the eyes, elbows high, 1s rear-delt squeeze. Posture insurance.", "Shorten the band when 15 feels easy.", { isNew: true }),
    ex("pu", "Push-Up (bench as needed)", "accessory", "max", "Bench or floor", "Body in one line, elbows 45\u00b0, full range. Elevate hands on the bench if floor reps exceed RPE 9.", "Move to a lower surface when you clear 3 \u00d7 10 clean."),
    ex("cr2", "Seated DB Calf Raise", "accessory", "12-15", "20 lb on knees", "Full stretch, 1s top squeeze, even pressure across the ball of the foot. Stop on any neuroma buzz.", "+5 lb when 15 feel strong and pain-free.", { isNew: true })
  ],
  finisher: "Side plank: 3 \u00d7 20s/side. Stack the hips, brace, breathe."
};
 
// ============ NON-STRENGTH DAYS ============
const TUE = {
  key: "tue", type: "sprint", label: "Sprint Intervals",
  focus: "Peloton · seated", durationMin: 26,
  warmup: [["Easy seated spin, building cadence", "5 min"]],
  body: [
    "Main set: 8 \u00d7 20s hard seated effort (RPE 9), 100s easy spin between.",
    "Seated the whole time to keep load off the forefoot. Resistance high enough that 20s is genuinely hard.",
    "Cool-down: 5 min easy spin."
  ],
  note: "Block 1 progression: 8 \u00d7 20s. Moves to 9 \u00d7 20s in Block 2, 10 \u00d7 25s in Block 3."
};
const THU = {
  key: "thu", type: "cardio", label: "Zone 2 Cardio",
  focus: "Walk or bike · flat", durationMin: 55,
  warmup: [["Easy build to Zone 2", "5 min"]],
  body: [
    "45 min steady in Zone 2: heart rate 106-124 bpm.",
    "Conversational pace, full sentences but you wouldn't want to sing. Flat only in Block 1 to keep the feet calm.",
    "Cool-down: 5 min easy."
  ],
  note: "Zone 2 target 106-124 bpm (Tanaka, age 44). Walk on the treadmill flat, or ride the Peloton at low resistance."
};
const SAT = {
  key: "sat", type: "cond", label: "Conditioning",
  focus: "Non-impact circuit", durationMin: 35,
  warmup: [["Easy bike or walk + band pull-aparts x15", "5 min"]],
  body: [
    "3-4 rounds, ~45s work / 20s transition, all non-impact:",
    "Goblet squat x12 \u00b7 DB row x10/side \u00b7 farmer carry 40s \u00b7 seated bike hard 30s \u00b7 dead bug 8/side.",
    "Keep the heart rate up, keep the feet quiet. Cool-down 5 min."
  ],
  note: "Impact intervals stay off in Block 1. They unlock in Block 2 only if every foot-pain rating this block stays 0-2."
};
const SUN = { key: "sun", type: "rest", label: "Rest" };
 
const DAYS = { mon: MON, tue: TUE, wed: WED, thu: THU, fri: FRI, sat: SAT, sun: SUN };
const ORDER = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
const DAY_ABBR = { mon: "Mon", tue: "Tue", wed: "Wed", thu: "Thu", fri: "Fri", sat: "Sat", sun: "Sun" };
const DOW_TO_KEY = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
 
// ============ STATE ============
const LS_KEY = "danielle_block1_v1";
let store = load();
function load() {
  try { const r = localStorage.getItem(LS_KEY); if (r) return JSON.parse(r); } catch (e) {}
  return { logs: {}, foot: {}, hang: {} };
}
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) {} }
 
// Week is your call, not the wall calendar. Defaults to Week 2 (your current week) and remembers what you last set.
let curWeek = store.curWeek || 2;
let curDay = DOW_TO_KEY[new Date().getDay()];
 
function logKey(w, d, code) { return w + ":" + d + ":" + code; }
 
// finisher active: W4 none; W1-2 Mon+Fri only; W3 all
function finisherActive(week, dayKey) {
  if (week === 4) return false;
  if (week === 3) return true;
  return dayKey === "mon" || dayKey === "fri";
}
 
// ============ TIMER ============
let timer = { total: 0, left: 0, id: null, running: false, exName: "" };
const tDigits = document.getElementById("timerDigits");
const tInfo = document.getElementById("timerInfo");
const tToggle = document.getElementById("tToggle");
 
function fmt(s) { const m = Math.floor(s / 60); const r = s % 60; return m + ":" + String(r).padStart(2, "0"); }
function renderTimer() {
  tDigits.textContent = fmt(timer.left);
  tDigits.className = "timer-digits" + (timer.running ? " run" : "") + (timer.left === 0 && timer.total > 0 ? " zero" : "");
  tToggle.textContent = timer.running ? "\u23f8" : "\u25b6";
}
function startTimer(seconds, name) {
  clearInterval(timer.id);
  timer.total = seconds; timer.left = seconds; timer.running = true; timer.exName = name || "";
  tInfo.innerHTML = "<b>Resting \u00b7 " + (name || "") + "</b>" + seconds + "s pulled from this exercise's prescription.";
  timer.id = setInterval(tick, 1000);
  renderTimer();
}
function tick() {
  if (timer.left > 0) { timer.left--; renderTimer(); if (timer.left === 0) alarm(); }
}
function alarm() {
  timer.running = false; clearInterval(timer.id); renderTimer();
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.frequency.value = 880; o.type = "sine";
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    o.start(); o.stop(ctx.currentTime + 0.6);
  } catch (e) {}
}
tToggle.onclick = function () {
  if (timer.total === 0) return;
  timer.running = !timer.running;
  if (timer.running) { if (timer.left === 0) timer.left = timer.total; timer.id = setInterval(tick, 1000); }
  else clearInterval(timer.id);
  renderTimer();
};
document.getElementById("tReset").onclick = function () {
  clearInterval(timer.id); timer.left = timer.total; timer.running = false; renderTimer();
};
 
// ============ DURATION ============
function strengthDuration(day, week) {
  const meta = WEEK_META[week - 1];
  let sec = day.wuMin * 60;
  if (day.hang) sec += day.hang.sets * (10 + day.hang.rest);
  day.ex.forEach(function (e) {
    sec += meta.sets * (35 + e.rest); // ~35s work per set
  });
  if (finisherActive(week, day.key)) sec += 420;
  return Math.round(sec / 60);
}
 
// ============ RENDER ============
const main = document.getElementById("main");
 
function maxFootPain() {
  let m = -1;
  Object.keys(store.foot).forEach(function (k) { const v = store.foot[k]; if (v > m) m = v; });
  return m;
}
function bestHang() {
  let m = 0;
  Object.keys(store.hang).forEach(function (k) { const v = store.hang[k]; if (v > m) m = v; });
  return m;
}
 
function renderStrip() {
  const strip = document.getElementById("weekStrip");
  strip.innerHTML = "";
  ORDER.forEach(function (k) {
    const d = DAYS[k];
    const chip = document.createElement("div");
    chip.className = "daychip" + (k === curDay ? " sel" : "") + (k === DOW_TO_KEY[new Date().getDay()] ? " today" : "");
    const focus = d.type === "rest" ? "Full rest" : d.focus;
    chip.innerHTML = "<div class='dc-day'>" + DAY_ABBR[k] + "</div><div class='dc-focus'>" + focus + "</div><div class='dc-dot t-" + d.type + "'></div>";
    chip.onclick = function () { curDay = k; renderAll(); };
    strip.appendChild(chip);
  });
}
 
function renderWeekNav() {
  const nav = document.getElementById("weekNav");
  nav.innerHTML = "";
  for (let w = 1; w <= 4; w++) {
    const el = document.createElement("div");
    el.className = "wk" + (w === curWeek ? " sel" : "");
    el.innerHTML = "W" + w + (WEEK_META[w - 1].deload ? "<span class='badge'>DELOAD</span>" : "");
    el.onclick = function () { curWeek = w; store.curWeek = w; save(); renderAll(); };
    nav.appendChild(el);
  }
  const meta = WEEK_META[curWeek - 1];
  document.getElementById("weekLabel").innerHTML = "Week " + curWeek + " of 4 \u00b7 " +
    (meta.deload ? "<span class='deload'>Deload \u00b7 RPE " + meta.rpe + "</span>" : "RPE " + meta.rpe + " \u00b7 " + meta.reps + " reps");
}
 
function renderDay() {
  const d = DAYS[curDay];
  main.innerHTML = "";
  if (d.type === "rest") { renderRest(); return; }
  if (d.type !== "strength") { renderCardio(d); return; }
  renderStrength(d);
}
 
function renderRest() {
  const box = document.createElement("div");
  box.className = "rest-note";
  box.innerHTML = "<h2>Sunday \u00b7 Rest</h2>" +
    "<p>Full rest. Optional easy walk if you want to move. This is where the training actually gets absorbed.</p>" +
    "<p style='color:var(--teal);margin-top:10px;'>Levers today: hit 100g protein and protect sleep. Both matter more than any session.</p>";
  main.appendChild(box);
}
 
function renderCardio(d) {
  const head = document.createElement("div");
  head.className = "day-head";
  head.innerHTML = "<div><div class='day-title'>" + DAY_ABBR[curDay] + " \u00b7 " + d.label + "</div>" +
    "<div class='day-sub'>" + d.focus + "</div></div>" +
    "<div class='duration'>~" + d.durationMin + " min</div>";
  main.appendChild(head);
 
  if (d.key === "sat") {
    const mp = maxFootPain();
    const b = document.createElement("div");
    if (mp > 2) { b.className = "banner lock"; b.textContent = "Foot pain has hit " + mp + " this block. Impact work stays locked. Keep conditioning non-impact."; }
    else { b.className = "banner info"; b.textContent = "Impact locked for Block 1 (non-impact circuit below). Foot pain max so far: " + (mp < 0 ? "none logged" : mp) + "."; }
    main.appendChild(b);
  }
 
  const wu = document.createElement("div");
  wu.innerHTML = "<div class='section-label'>Warm-up</div>";
  const wl = document.createElement("div"); wl.className = "warmup";
  d.warmup.forEach(function (row) {
    const r = document.createElement("div"); r.className = "wu";
    r.innerHTML = "<span>" + row[0] + "</span><span class='t'>" + row[1] + "</span>";
    wl.appendChild(r);
  });
  wu.appendChild(wl); main.appendChild(wu);
 
  const sec = document.createElement("div");
  sec.innerHTML = "<div class='section-label'>Session</div>";
  const body = document.createElement("div"); body.className = "ex";
  body.innerHTML = d.body.map(function (t) { return "<div class='ex-cue' style='font-style:normal;color:var(--text);margin:6px 0;'>" + t + "</div>"; }).join("");
  sec.appendChild(body); main.appendChild(sec);
 
  if (d.note) { const n = document.createElement("div"); n.className = "wk-note"; n.textContent = d.note; main.appendChild(n); }
}
 
function renderStrength(d) {
  const meta = WEEK_META[curWeek - 1];
  const dur = strengthDuration(d, curWeek);
  const head = document.createElement("div");
  head.className = "day-head";
  head.innerHTML = "<div><div class='day-title'>" + DAY_ABBR[curDay] + " \u00b7 " + d.label + "</div>" +
    "<div class='day-sub'>" + d.focus + "</div></div>" +
    "<div class='duration'>~" + dur + " min</div>";
  main.appendChild(head);
 
  const note = document.createElement("div");
  note.className = "wk-note" + (meta.deload ? " deload" : "");
  note.textContent = meta.note;
  main.appendChild(note);
 
  // warm-up
  const wuLabel = document.createElement("div");
  wuLabel.className = "section-label";
  wuLabel.textContent = "Warm-up \u00b7 " + d.wuMin + " min";
  main.appendChild(wuLabel);
  const wl = document.createElement("div"); wl.className = "warmup";
  d.warmup.forEach(function (row) {
    const r = document.createElement("div"); r.className = "wu";
    r.innerHTML = "<span>" + row[0] + "</span><span class='t'>" + row[1] + "</span>";
    wl.appendChild(r);
  });
  main.appendChild(wl);
 
  // dead hang
  if (d.hang) renderHang(d);
 
  // main work
  const ml = document.createElement("div");
  ml.className = "section-label"; ml.textContent = "Main work";
  main.appendChild(ml);
  d.ex.forEach(function (e) { main.appendChild(renderEx(e, meta)); });
 
  // finisher
  if (finisherActive(curWeek, d.key)) {
    const f = document.createElement("div"); f.className = "finisher";
    f.innerHTML = "<div class='ex-top'><span class='ex-name'>Finisher</span></div><div class='ex-cue' style='color:var(--text);font-style:normal;margin-top:6px;'>" + d.finisher + "</div>";
    main.appendChild(f);
  } else {
    const skip = document.createElement("div"); skip.className = "wk-note";
    skip.textContent = curWeek === 4 ? "No finisher on deload week." : "No finisher this session. Finishers run every other strength day in Weeks 1-2, then all three in Week 3.";
    main.appendChild(skip);
  }
 
  // foot pain (strength days only)
  renderFoot(d);
}
 
function renderHang(d) {
  const best = bestHang();
  const target = 120;
  const pct = Math.min(100, Math.round(best / target * 100));
  const box = document.createElement("div"); box.className = "hang-box";
  box.innerHTML =
    "<div class='ex-top'><span class='hang-title'>" + d.hang.title + "</span><span class='ex-rx'>" + d.hang.scheme + " \u00b7 " + d.hang.rest + "s</span></div>" +
    "<div class='bar-track'><div class='bar-fill' style='width:" + pct + "%'></div></div>" +
    "<div class='hang-meta'><span>Best hold: <b style='color:var(--teal)'>" + best + "s</b></span><span>Target: 2:00</span></div>";
  const row = document.createElement("div"); row.className = "hang-log-row";
  const lab = document.createElement("div"); lab.className = "in-wrap";
  const inp = document.createElement("input"); inp.type = "number"; inp.className = "hang-in"; inp.inputMode = "numeric";
  inp.placeholder = "Best hold this session (s)";
  const hk = logKey(curWeek, d.key, "hang");
  if (store.hang[hk] != null) inp.value = store.hang[hk];
  lab.appendChild(inp);
  const chk = document.createElement("button"); chk.className = "chk" + (store.hang[hk] != null ? " done" : "");
  chk.textContent = "\u2713";
  chk.onclick = function () {
    const v = parseInt(inp.value, 10);
    if (!isNaN(v)) { store.hang[hk] = v; save(); renderDay(); startTimer(d.hang.rest, d.hang.title); }
  };
  row.appendChild(lab); row.appendChild(chk);
  box.appendChild(row);
  const hint = document.createElement("div"); hint.className = "foot-hint";
  hint.textContent = "Band-assisted pull-ups begin only after a 2:00 hold. Log your best set here.";
  box.appendChild(hint);
  main.appendChild(box);
}
 
function renderEx(e, meta) {
  const box = document.createElement("div");
  box.className = "ex" + (e.isNew ? " newtag" : "");
  const reps = e.reps || meta.reps;
  const repsTxt = e.perSide ? reps + "/side" : reps;
  box.innerHTML =
    "<div class='ex-top'><span class='ex-name'>" + e.name + (e.isNew ? "<span class='new'>NEW</span>" : "") + "</span>" +
    "<span class='ex-rx'>" + meta.sets + " \u00d7 " + repsTxt + " \u00b7 RPE " + meta.rpe + " \u00b7 " + e.rest + "s</span></div>" +
    "<div class='ex-start'>Start: " + e.start + "</div>" +
    "<div class='ex-cue'>" + e.cue + "</div>" +
    "<div class='ex-prog'>\u2197 " + e.prog + "</div>";
  const sets = document.createElement("div"); sets.className = "sets";
  for (let s = 0; s < meta.sets; s++) sets.appendChild(renderSet(e, s));
  box.appendChild(sets);
  return box;
}
 
function renderSet(e, idx) {
  const row = document.createElement("div"); row.className = "set-row";
  const key = logKey(curWeek, curDay, e.code);
  store.logs[key] = store.logs[key] || [];
  const rec = store.logs[key][idx] || { w: "", r: "", rpe: "", done: false };
  const sn = document.createElement("div"); sn.className = "set-n"; sn.textContent = (idx + 1);
  row.appendChild(sn);
 
  function field(lab, val, prop) {
    const wrap = document.createElement("div"); wrap.className = "in-wrap";
    const l = document.createElement("span"); l.className = "lab"; l.textContent = lab;
    const inp = document.createElement("input"); inp.type = "number"; inp.inputMode = "decimal"; inp.value = val;
    inp.onchange = function () {
      store.logs[key][idx] = store.logs[key][idx] || { w: "", r: "", rpe: "", done: false };
      store.logs[key][idx][prop] = inp.value; save();
    };
    wrap.appendChild(l); wrap.appendChild(inp); return wrap;
  }
  row.appendChild(field("lb", rec.w, "w"));
  row.appendChild(field("reps", rec.r, "r"));
  row.appendChild(field("rpe", rec.rpe, "rpe"));
 
  const chk = document.createElement("button");
  chk.className = "chk" + (rec.done ? " done" : "");
  chk.textContent = "\u2713";
  chk.onclick = function () {
    store.logs[key][idx] = store.logs[key][idx] || { w: "", r: "", rpe: "", done: false };
    const now = !store.logs[key][idx].done;
    store.logs[key][idx].done = now; save();
    chk.className = "chk" + (now ? " done" : "");
    if (now) startTimer(e.rest, e.name);
  };
  row.appendChild(chk);
  return row;
}
 
function renderFoot(d) {
  const box = document.createElement("div"); box.className = "foot";
  box.innerHTML = "<div class='foot-title'>Foot check \u00b7 log after the session</div>";
  const scale = document.createElement("div"); scale.className = "foot-scale";
  const fk = logKey(curWeek, d.key, "foot");
  const cur = store.foot[fk];
  for (let i = 0; i <= 5; i++) {
    const b = document.createElement("div");
    b.className = "fp" + (cur === i ? " sel" + (i > 2 ? " hi" : "") : "");
    b.textContent = i;
    b.onclick = function () { store.foot[fk] = i; save(); renderDay(); };
    scale.appendChild(b);
  }
  box.appendChild(scale);
  const hint = document.createElement("div"); hint.className = "foot-hint";
  hint.textContent = "0 = nothing, 5 = sharp. Impact reintroduction in Block 2 needs every rating to stay 0-2 across this block.";
  box.appendChild(hint);
  main.appendChild(box);
}
 
// ============ CSV ============
function csvEscape(v) { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportCSV() {
  const rows = [["week", "day", "session", "exercise", "set", "prescribed_reps", "prescribed_rpe", "rest_s", "actual_weight", "actual_reps", "actual_rpe", "completed"]];
  [1, 2, 3, 4].forEach(function (w) {
    const meta = WEEK_META[w - 1];
    ["mon", "wed", "fri"].forEach(function (dk) {
      const d = DAYS[dk];
      d.ex.forEach(function (e) {
        const key = logKey(w, dk, e.code);
        const log = store.logs[key] || [];
        for (let s = 0; s < meta.sets; s++) {
          const rec = log[s] || {};
          rows.push([w, dk, d.label, e.name, s + 1, e.reps || meta.reps, meta.rpe, e.rest, rec.w || "", rec.r || "", rec.rpe || "", rec.done ? "yes" : ""]);
        }
      });
    });
  });
  // hang log
  rows.push([]);
  rows.push(["dead_hang_log"]);
  rows.push(["week", "day", "best_hold_s"]);
  Object.keys(store.hang).forEach(function (k) {
    const p = k.split(":"); rows.push([p[0], p[1], store.hang[k]]);
  });
  // foot log
  rows.push([]);
  rows.push(["foot_pain_log"]);
  rows.push(["week", "day", "pain_0_5"]);
  Object.keys(store.foot).forEach(function (k) {
    const p = k.split(":"); rows.push([p[0], p[1], store.foot[k]]);
  });
  const csv = rows.map(function (r) { return r.map(csvEscape).join(","); }).join("\n");
  const d = new Date();
  const stamp = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "danielle_block1_" + stamp + ".csv";
  a.click();
}
document.getElementById("csvBtn").onclick = exportCSV;
 
// ============ INIT ============
function renderAll() { renderStrip(); renderWeekNav(); renderDay(); }
renderTimer();
renderAll();
</script>
</body>
</html>
