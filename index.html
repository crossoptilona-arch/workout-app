<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Danielle · Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c1b19; --surface:#26241f; --surface2:#302d27; --surface3:#3a362e;
    --border:#443f35; --text:#ece7dc; --text2:#a89f8f; --text3:#7d766a;
    --brass:#c9922f; --brass-dim:#8a6a30;
    --olive:#7a9b6e; --rust:#b5533c; --blue:#6f9bb8;
    --deload:#8b6f47;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding-bottom:110px; -webkit-tap-highlight-color:transparent;}
  h1,h2,h3{font-family:'Fraunces',serif; margin:0; letter-spacing:.2px;}
  .mono{font-family:'JetBrains Mono',monospace;}
  input,button,select{font-family:inherit;}
  header{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--border); padding:14px 16px 10px;}
  .header-row{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  header h1{font-size:19px; color:var(--brass); font-weight:600;}
  header .sub{font-size:11px; color:var(--text3); margin-top:2px;}
  .btn{background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:12.5px; cursor:pointer; white-space:nowrap;}
  .btn:active{background:var(--surface3);}
  .btn.brass{background:var(--brass); color:#211a0d; border-color:var(--brass); font-weight:600;}
  .btn.small{padding:5px 9px; font-size:11px;}

  /* 7-day overview strip */
  .strip{display:flex; gap:8px; overflow-x:auto; padding:12px 16px 4px; scrollbar-width:none;}
  .strip::-webkit-scrollbar{display:none;}
  .strip-card{flex:0 0 auto; width:78px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:8px 6px; text-align:center; cursor:pointer;}
  .strip-card.today{border-color:var(--brass); box-shadow:0 0 0 1px var(--brass) inset;}
  .strip-card.selected{background:var(--surface3);}
  .strip-card .dow{font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:.5px;}
  .strip-card .dt{font-size:12px; color:var(--text2); margin:2px 0 6px;}
  .strip-card .type{font-size:10.5px; font-weight:600; padding:3px 4px; border-radius:5px; line-height:1.25;}
  .tp-strength{background:rgba(201,146,47,.18); color:var(--brass);}
  .tp-cardio{background:rgba(111,155,184,.18); color:var(--blue);}
  .tp-cond{background:rgba(122,155,110,.18); color:var(--olive);}
  .tp-rest{background:rgba(255,255,255,.06); color:var(--text3);}
  .tp-review{background:rgba(181,83,60,.18); color:var(--rust);}
  .deload-dot{display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--deload); margin-left:3px;}

  /* jump nav */
  .jumpnav{display:flex; gap:6px; padding:4px 16px 12px; flex-wrap:wrap; align-items:center;}
  .jumpnav select{background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:7px; padding:6px 8px; font-size:12px;}

  main{padding:6px 16px 20px;}
  .day-banner{border-radius:var(--radius); padding:12px 14px; margin-bottom:12px; border:1px solid var(--border); background:var(--surface);}
  .day-banner h2{font-size:20px;}
  .day-banner .meta{font-size:12px; color:var(--text2); margin-top:3px;}
  .badge{display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; padding:2px 7px; border-radius:20px; margin-left:6px; vertical-align:middle;}
  .badge.deload{background:var(--deload); color:#1c1b19;}
  .badge.gated{background:var(--surface3); color:var(--text2); border:1px solid var(--border);}
  .badge.unlocked{background:var(--olive); color:#16210f;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; margin-bottom:10px;}
  .card h3{font-size:15px; color:var(--text);}
  .card .rx{font-size:11.5px; color:var(--text2); margin-top:2px;}
  .setrow{display:grid; grid-template-columns:26px 1fr 1fr 1fr 34px; gap:6px; align-items:center; margin-top:8px;}
  .setrow .lbl{font-size:11px; color:var(--text3);}
  .setrow input{width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:7px 6px; font-size:14px; text-align:center;}
  .setrow input::placeholder{color:var(--text3);}
  .check{width:30px; height:30px; border-radius:7px; border:1px solid var(--border); background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer;}
  .check.done{background:var(--olive); border-color:var(--olive); color:#16210f;}
  .cue{margin-top:9px; font-size:12px; background:rgba(201,146,47,.12); border:1px solid var(--brass-dim); color:var(--brass); border-radius:7px; padding:7px 9px;}
  .warmup{font-size:12px; color:var(--text2); background:var(--surface2); border-radius:8px; padding:9px 11px; margin-bottom:10px;}
  .finisher{font-size:12.5px; color:var(--text2); background:var(--surface2); border-radius:8px; padding:9px 11px; margin-top:2px;}
  .finisher b{color:var(--text);}

  .pain{display:flex; gap:8px; align-items:center; margin-top:6px;}
  .pain input[type=range]{flex:1;}
  .pain .val{font-family:'JetBrains Mono',monospace; font-size:14px; width:22px; text-align:center;}

  .zone2box{font-size:13px; line-height:1.6;}
  .zone2box .hr{font-family:'JetBrains Mono',monospace; color:var(--brass); font-size:16px;}
  .review ul{margin:6px 0 0 18px; padding:0; font-size:13px; color:var(--text2); line-height:1.7;}

  /* floating timer bar */
  .timerbar{position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--surface2); border-top:1px solid var(--border); padding:8px 12px 10px; box-shadow:0 -4px 14px rgba(0,0,0,.35);}
  .timerbar.ringing{background:var(--rust);}
  .timerbar-top{display:flex; align-items:center; gap:10px;}
  .timerbar .display{font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:700; color:var(--brass); min-width:70px;}
  .timerbar.ringing .display{color:#fff;}
  .timerbar .mode{font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:var(--text3);}
  .timerbar.ringing .mode{color:rgba(255,255,255,.8);}
  .timerbar .ctx{font-size:11px; color:var(--text2); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .timerbar.ringing .ctx{color:rgba(255,255,255,.9);}
  .timerbar-chips{display:flex; gap:6px; margin-top:7px; overflow-x:auto;}
  .chip{flex:0 0 auto; background:var(--surface3); border:1px solid var(--border); color:var(--text2); border-radius:20px; padding:6px 12px; font-size:12px; cursor:pointer;}
  .chip.pause{color:var(--text);}

  footer.exportbar{padding:6px 16px 0;}
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div>
      <h1>Danielle · Training Log</h1>
      <div class="sub" id="todayLabel"></div>
    </div>
    <button class="btn brass" id="exportBtn">Export CSV</button>
  </div>
</header>

<div class="strip" id="strip"></div>

<div class="jumpnav">
  <select id="selBlock"></select>
  <select id="selWeek"></select>
  <select id="selDay"></select>
  <button class="btn small" id="jumpBtn">View</button>
</div>

<main id="main"></main>

<div class="timerbar" id="timerbar">
  <div class="timerbar-top">
    <div class="display mono" id="timerDisplay">0:00</div>
    <div>
      <div class="mode" id="timerMode">IDLE</div>
      <div class="ctx" id="timerCtx">Tap a chip to start</div>
    </div>
  </div>
  <div class="timerbar-chips">
    <div class="chip" id="chipRest">Rest</div>
    <div class="chip" data-s="15">15s</div>
    <div class="chip" data-s="30">30s</div>
    <div class="chip" data-s="45">45s</div>
    <div class="chip" data-s="60">60s</div>
    <div class="chip pause" id="chipPause">Pause</div>
    <div class="chip" id="chipReset">Reset</div>
  </div>
</div>

<script>
/* ============================== DATA ============================== */
/* Evidence-based inter-set rest, by exercise role:
   main    120s — multi-joint compound at RPE 7+, full ATP-PC recovery for force output (Schoenfeld 2016, de Salles 2009)
   power    90s — explosive/ballistic movements, lighter load but needs full CNS recovery for quality output
   accessory 60s — single-joint/isolation, standard hypertrophy-rest recovers faster than compounds
   grip     60s — loaded carries, similar recovery demand to accessory work
   core     45s — anti-rotation/anti-extension holds, low systemic load
   bodyweight 60s — unweighted compound patterns (push-up, dip, step work) */
const REST_RULES = { main:120, power:90, accessory:60, grip:60, core:45, bodyweight:60 };

const EX = {
  goblet_squat:{name:'Goblet Squat',cat:'lower',unit:'lb',start:25,restType:'main'},
  bent_row:{name:'Bent-Over Row',cat:'upper',unit:'lb',start:15,restType:'main'},
  chest_press:{name:'Chest Press',cat:'upper',unit:'lb',start:20,restType:'main'},
  lateral_raise:{name:'Lateral Raise',cat:'upper',unit:'lb',start:8,restType:'accessory'},
  bicep_curl:{name:'Bicep Curl',cat:'upper',unit:'lb',start:12,restType:'accessory'},
  db_swing:{name:'DB Swing',cat:'lower',unit:'lb',start:20,restType:'power'},
  dead_bug:{name:'Dead Bug',cat:'core',unit:'bw',restType:'core'},
  reverse_lunge:{name:'Reverse Lunge',cat:'lower',unit:'lb',start:15,restType:'main'},
  sl_rdl:{name:'Single-Leg RDL',cat:'lower',unit:'lb',start:10,restType:'main'},
  reverse_fly:{name:'Reverse Fly',cat:'upper',unit:'lb',start:8,restType:'accessory'},
  explosive_pushup:{name:'Explosive Push-Up',cat:'upper',unit:'bw',restType:'power'},
  pallof:{name:'Pallof Press',cat:'core',unit:'band',restType:'core'},
  farmer_carry:{name:'Farmer Carry',cat:'grip',unit:'lb',start:25,restType:'grip'},
  db_rdl:{name:'DB RDL',cat:'lower',unit:'lb',start:20,restType:'main'},
  bench_dip:{name:'Bench Dip',cat:'upper',unit:'bw',restType:'bodyweight'},
  pushup:{name:'Push-Up',cat:'upper',unit:'bw',restType:'bodyweight'},
  side_plank:{name:'Side Plank',cat:'core',unit:'time',restType:'core'},
  suitcase_carry:{name:'Suitcase Carry',cat:'grip',unit:'lb',start:25,restType:'grip'},
  face_pull:{name:'Band Face Pull',cat:'upper',unit:'band',restType:'accessory'},
  tricep_kickback:{name:'DB Tricep Kickback',cat:'upper',unit:'lb',start:8,restType:'accessory'},
  plank:{name:'Plank',cat:'core',unit:'time',restType:'core'},
  bosu_stepup:{name:'Bosu Step-Up',cat:'lower',unit:'bw',restType:'bodyweight'},
  band_row:{name:'Band Row',cat:'upper',unit:'band',restType:'accessory'},
  stepup_impact:{name:'Low Step-Up (controlled landing)',cat:'lower',unit:'bw',restType:'bodyweight'},
  pogo:{name:'Pogo Hops in Place',cat:'lower',unit:'bw',restType:'power'},
  sl_hop:{name:'Single-Leg Hop',cat:'lower',unit:'bw',restType:'power'},
  broad_jump:{name:'Broad Jump Landing',cat:'lower',unit:'bw',restType:'power'},
};
const PROGRESSABLE = ['lb'];

function E(id,sets,repsLow,repsHigh){ return {ex:id, sets, rest:REST_RULES[EX[id].restType], repsLow, repsHigh}; }

const DAYS = {
  block1:{
    mon:{type:'strength', label:'Strength A', focus:'Squat · Row · Press', hang:{type:'Max hold test',sets:3,dur:15},
      list:[E('goblet_squat',3,8,10),E('bent_row',3,8,10),E('chest_press',3,8,10),
            E('lateral_raise',3,8,10),E('bicep_curl',3,8,10),E('db_swing',3,8,10),E('dead_bug',3,10,10)],
      finisher:'7 min circuit: DB swing / push-up / mountain climber'},
    wed:{type:'strength', label:'Strength B', focus:'Lunge · RDL · Push', hang:{type:'Volume holds',sets:4,dur:12},
      list:[E('reverse_lunge',3,8,10),E('sl_rdl',3,8,10),E('bicep_curl',3,8,10),E('reverse_fly',3,8,10),
            E('explosive_pushup',3,6,6),E('pallof',3,10,10),E('farmer_carry',3,30,30)],
      finisher:'Suitcase carry 4x30s/side'},
    fri:{type:'strength', label:'Strength C', focus:'Squat · RDL · Dip', hang:{type:'Active scapular pull',sets:3,dur:10},
      list:[E('goblet_squat',3,8,10),E('bent_row',3,8,10),E('db_rdl',3,8,10),
            E('lateral_raise',3,8,10),E('bench_dip',3,10,10),E('pushup',3,10,10)],
      finisher:'Side plank 3x20s/side'},
    tue:{type:'cardio', label:'Zone 2', machine:'Peloton Bike', mode:'Peloton bike, steady resistance', min:55},
    thu:{type:'cardio', label:'Zone 2', machine:'Incline Walk', mode:'Treadmill incline 6-8%, moderate pace', min:55},
    sat:{type:'cardio', label:'Zone 2', machine:'Walk/Bike Mix', mode:'Mixed walk/bike, extended session', min:80},
    sun:{type:'rest', label:'Rest'}
  },
  block2:{
    mon:{type:'strength', label:'Strength A', focus:'Squat · Row · Press', hang:{type:'Max hold test',sets:3,dur:20},
      list:[E('goblet_squat',3,8,8),E('bent_row',3,8,8),E('chest_press',3,8,8),
            E('face_pull',3,12,12),E('bicep_curl',3,8,8),E('db_swing',3,12,12),E('dead_bug',3,10,10)],
      finisher:'7 min circuit: DB swing / push-up / mountain climber'},
    wed:{type:'strength', label:'Strength B', focus:'Lunge · RDL · Push', hang:{type:'Volume holds',sets:4,dur:15},
      list:[E('reverse_lunge',3,8,8),E('sl_rdl',3,8,8),E('bicep_curl',3,8,8),E('reverse_fly',3,12,12),
            E('explosive_pushup',3,6,6),E('tricep_kickback',3,12,12),E('pallof',3,10,10),E('farmer_carry',3,30,30)],
      finisher:null},
    fri:{type:'strength', label:'Strength C', focus:'Squat · RDL · Dip', hang:{type:'Active scapular pull',sets:3,dur:15},
      list:[E('goblet_squat',3,8,8),E('bent_row',3,8,8),E('db_rdl',3,8,8),
            E('lateral_raise',3,12,12),E('bench_dip',3,10,10),E('pushup',3,10,10),E('plank',3,30,30)],
      finisher:'Side plank 3x20s/side, suitcase carry 3x30s/side'},
    tue:{type:'cardio', label:'Zone 2', machine:'Peloton Bike', mode:'Peloton bike, steady resistance', min:55},
    thu:{type:'cardio', label:'Zone 2', machine:'Incline Walk', mode:'Treadmill incline 6-8%, moderate pace', min:55},
    sat:{type:'conditioning', label:'Conditioning', focus:'Circuit · 3 Rounds', rounds:3, restRounds:90,
      base:['db_swing','bosu_stepup','band_row','pushup','farmer_carry'],
      impact:['stepup_impact','pogo'], gateBlock:'block1'},
    sun:{type:'rest', label:'Rest'}
  },
  block3:{
    mon:{type:'strength', label:'Strength A', focus:'Squat · Row · Press', hang:{type:'Max hold test',sets:3,dur:25},
      list:[E('goblet_squat',3,6,8),E('bent_row',3,6,8),E('chest_press',3,6,8),
            E('face_pull',3,12,12),E('bicep_curl',3,6,8),E('db_swing',3,12,12),E('dead_bug',3,10,10)],
      finisher:'EMOM 5 min: odd min DB swing x12, even min mountain climbers x20'},
    wed:{type:'strength', label:'Strength B', focus:'Lunge · RDL · Push', hang:{type:'Volume holds',sets:4,dur:18},
      list:[E('reverse_lunge',3,6,8),E('sl_rdl',3,6,8),E('bicep_curl',3,6,8),E('reverse_fly',3,12,12),
            E('explosive_pushup',3,6,6),E('tricep_kickback',3,12,12),E('pallof',3,10,10),E('farmer_carry',3,30,30)],
      finisher:'EMOM 4 min: alternate farmer carry 30s / bodyweight squat x15'},
    fri:{type:'strength', label:'Strength C', focus:'Squat · RDL · Dip', hang:{type:'Active scapular pull',sets:3,dur:18},
      list:[E('goblet_squat',3,6,8),E('bent_row',3,6,8),E('db_rdl',3,6,8),
            E('lateral_raise',3,12,12),E('bench_dip',3,10,10),E('pushup',3,10,10),E('plank',3,30,30)],
      finisher:'Side plank + suitcase carry, then 3 min AMRAP push-up/mountain climber'},
    tue:{type:'cardio', label:'Zone 2', machine:'Peloton Bike', mode:'Peloton bike, steady resistance', min:55},
    thu:{type:'cardio', label:'Zone 2', machine:'Incline Walk', mode:'Treadmill incline 6-8%, moderate pace', min:55},
    sat:{type:'conditioning', label:'Conditioning', focus:'Circuit · 4 Rounds', rounds:4, restRounds:60,
      base:['db_swing','bosu_stepup','band_row','pushup','farmer_carry'],
      impact:['sl_hop','broad_jump'], gateBlock:'block2'},
    sun:{type:'rest', label:'Rest'}
  },
  taper:{
    d1:{type:'strength', label:'Light Full-Body', focus:'Squat · Row · Press (light)', hang:{type:'Max hold — retest toward 2:00',sets:2,dur:null},
      list:[E('goblet_squat',2,8,8),E('bent_row',2,8,8),E('chest_press',2,8,8),E('dead_bug',2,10,10)], finisher:null},
    d2:{type:'cardio', label:'Zone 2', machine:'Peloton Bike (easy)', mode:'Peloton bike, easy resistance', min:30},
    d3:{type:'strength', label:'Light Full-Body', focus:'Lunge · RDL · Raise', hang:null,
      list:[E('reverse_lunge',2,8,8),E('sl_rdl',2,8,8),E('lateral_raise',2,12,12),E('bicep_curl',2,10,10),E('pallof',2,10,10)], finisher:null},
    d4:{type:'cardio', label:'Zone 2', machine:'Peloton Bike (easy)', mode:'Peloton bike, easy resistance', min:30},
    d5:{type:'review', label:'Rest + Block Review'}
  }
};

const PHASES = {
  block1:[
    {week:1,rpe:'6-7',rpeMax:7,repsLow:8,repsHigh:10,phase:'build'},
    {week:2,rpe:'7-8',rpeMax:8,repsLow:8,repsHigh:8,phase:'build'},
    {week:3,rpe:'8',rpeMax:8,repsLow:6,repsHigh:8,phase:'intensify'},
    {week:4,rpe:'5-6',rpeMax:6,repsLow:8,repsHigh:10,phase:'deload'}
  ],
  block2:[
    {week:1,rpe:'7',rpeMax:7,repsLow:8,repsHigh:8,phase:'resume'},
    {week:2,rpe:'7-8',rpeMax:8,repsLow:8,repsHigh:8,phase:'build'},
    {week:3,rpe:'8-9',rpeMax:9,repsLow:6,repsHigh:8,phase:'intensify'},
    {week:4,rpe:'6',rpeMax:6,repsLow:8,repsHigh:10,phase:'deload'}
  ],
  block3:[
    {week:1,rpe:'7-8',rpeMax:8,repsLow:6,repsHigh:8,phase:'resume'},
    {week:2,rpe:'8',rpeMax:8,repsLow:6,repsHigh:8,phase:'build'},
    {week:3,rpe:'8-9',rpeMax:9,repsLow:5,repsHigh:6,phase:'intensify'},
    {week:4,rpe:'6',rpeMax:6,repsLow:8,repsHigh:10,phase:'deload'}
  ],
  taper:[{week:1,rpe:'6',rpeMax:6,repsLow:8,repsHigh:8,phase:'taper'}]
};

const BLOCK_RANGES = [
  {id:'block1', start:'2026-07-02', end:'2026-07-29', label:'Block 1 · Rebuild'},
  {id:'block2', start:'2026-07-30', end:'2026-08-26', label:'Block 2 · Build'},
  {id:'block3', start:'2026-08-27', end:'2026-09-23', label:'Block 3 · Intensify'},
  {id:'taper',  start:'2026-09-24', end:'2026-09-28', label:'Taper'}
];

const TIMELINE = [];
['block1','block2','block3','taper'].forEach(b=>PHASES[b].forEach(p=>TIMELINE.push({block:b, week:p.week, ...p})));

const DOW_KEYS = ['sun','mon','tue','wed','thu','fri','sat'];
const DOW_LABEL = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* ============================== DATE HELPERS ============================== */
function toISO(d){ return d.toISOString().slice(0,10); }
function parseISO(s){ const [y,m,dd]=s.split('-').map(Number); return new Date(y,m-1,dd); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }

function resolveDate(date){
  const iso = toISO(date);
  for(const b of BLOCK_RANGES){
    if(iso>=b.start && iso<=b.end){
      const start = parseISO(b.start);
      const diffDays = Math.round((date-start)/86400000);
      if(b.id==='taper'){
        const idx = Math.min(4, Math.max(0, diffDays));
        return {block:'taper', week:1, dayKey:'d'+(idx+1), label:'Taper Day '+(idx+1), blockLabel:b.label};
      }
      const week = Math.min(4, Math.floor(diffDays/7)+1);
      const dayKey = DOW_KEYS[date.getDay()];
      return {block:b.id, week, dayKey, label:DOW_LABEL[date.getDay()], blockLabel:b.label};
    }
  }
  return null;
}

function phaseFor(block,week){ return PHASES[block].find(p=>p.week===week); }
function dayTemplate(block,dayKey){ return DAYS[block][dayKey]; }

/* ============================== STORAGE ============================== */
const cache = {};
async function sget(key){
  if(cache[key]!==undefined) return cache[key];
  try{ const r = await window.storage.get(key); const v = r? JSON.parse(r.value): null; cache[key]=v; return v; }
  catch(e){ cache[key]=null; return null; }
}
async function sset(key,val){ cache[key]=val; try{ await window.storage.set(key, JSON.stringify(val)); }catch(e){ console.error('storage set failed', e); } }

function sessionKey(block,week,dayKey,iso){ return `log:${block}:w${week}:${dayKey}:${iso}`; }
function exStateKey(exId){ return `exstate:${exId}`; }

async function getExState(exId){
  return (await sget(exStateKey(exId))) || {currentTarget:null, lastWeight:null, lastReps:null, lastRPE:null, preIntensifyWeight:null, reason:''};
}
async function setExState(exId, state){ await sset(exStateKey(exId), state); }

async function getSession(block,week,dayKey,iso){
  return (await sget(sessionKey(block,week,dayKey,iso))) || {exercises:{}, footPain:null, backPain:null};
}
async function saveSession(block,week,dayKey,iso,sess){ await sset(sessionKey(block,week,dayKey,iso), sess); }

/* ============================== PROGRESSION ENGINE ============================== */
function roundToIncrement(v, cat){
  const inc = cat==='lower' ? 5 : 2.5;
  return Math.round(v/inc)*inc;
}

function computeNextTarget(exId, loggedWeight, loggedReps, loggedRPE, curPhaseObj, nextPhaseObj, exState){
  const cat = EX[exId].cat;
  if(!nextPhaseObj){
    return {target:loggedWeight, reason:'End of program. Hold at this weight pending Block 4 planning.'};
  }
  if(nextPhaseObj.phase==='deload'){
    const t = roundToIncrement(loggedWeight*0.825, cat);
    return {target:t, reason:`Deload next: load cut ~17% from ${loggedWeight}lb.`};
  }
  if(curPhaseObj.phase==='deload' && nextPhaseObj.phase!=='deload'){
    const t = exState.preIntensifyWeight || roundToIncrement(loggedWeight*1.18, cat);
    return {target:t, reason: exState.preIntensifyWeight
      ? `Resuming post-deload at your last intensification-week weight (${t}lb).`
      : `Resuming post-deload. No prior intensification weight on file, estimated at ${t}lb — adjust if that's off.`};
  }
  const rpeMax = curPhaseObj.rpeMax;
  if(loggedReps>=curPhaseObj.repsHigh && loggedRPE<=rpeMax){
    const inc = cat==='lower'?5:2.5;
    const t = loggedWeight+inc;
    return {target:t, reason:`Hit top of range (${loggedReps}) at RPE ${loggedRPE}, add ${inc}lb next time.`};
  }
  if(loggedRPE>rpeMax){
    return {target:loggedWeight, reason:`RPE ${loggedRPE} ran above the ${curPhaseObj.rpe} target, hold ${loggedWeight}lb next time.`};
  }
  return {target:loggedWeight, reason:`Reps under top of range, repeat ${loggedWeight}lb before progressing.`};
}

async function logSet(exId, block, week, weight, reps, rpe){
  const exState = await getExState(exId);
  const curPhase = phaseFor(block, week);
  const tIdx = TIMELINE.findIndex(t=>t.block===block && t.week===week);
  const nextPhaseEntry = TIMELINE[tIdx+1] || null;
  exState.lastWeight = weight; exState.lastReps = reps; exState.lastRPE = rpe;
  if(curPhase.phase==='intensify') exState.preIntensifyWeight = weight;
  const {target, reason} = computeNextTarget(exId, weight, reps, rpe, curPhase, nextPhaseEntry, exState);
  exState.currentTarget = target; exState.reason = reason;
  await setExState(exId, exState);
  return {target, reason};
}

/* ============================== FOOT PAIN GATE ============================== */
async function blockFootDataClean(block){
  const range = BLOCK_RANGES.find(b=>b.id===block);
  if(!range) return null;
  const template = DAYS[block];
  const strengthDays = Object.keys(template).filter(k=>template[k].type==='strength');
  let start = parseISO(range.start), end = parseISO(range.end);
  let found=false, allClean=true;
  for(let d=new Date(start); d<=end; d=addDays(d,1)){
    const dow = DOW_KEYS[d.getDay()];
    if(!strengthDays.includes(dow)) continue;
    const r = resolveDate(d);
    if(!r) continue;
    const sess = await sget(sessionKey(r.block, r.week, r.dayKey, toISO(d)));
    if(sess && sess.footPain!=null){ found=true; if(sess.footPain>2) allClean=false; }
  }
  if(!found) return null;
  return allClean;
}

/* ============================== RENDER: 7-DAY STRIP ============================== */
let selectedDate = new Date();

async function renderStrip(){
  const strip = document.getElementById('strip');
  strip.innerHTML='';
  const today = new Date(); today.setHours(0,0,0,0);
  for(let i=0;i<7;i++){
    const d = addDays(today, i);
    const r = resolveDate(d);
    const card = document.createElement('div');
    card.className = 'strip-card' + (i===0?' today':'') + (toISO(d)===toISO(selectedDate)?' selected':'');
    let typeClass='tp-rest', typeLabel='—', deload=false;
    if(r){
      const tmpl = dayTemplate(r.block, r.dayKey);
      const phase = phaseFor(r.block, r.week);
      deload = phase && phase.phase==='deload';
      if(tmpl.type==='strength'){typeClass='tp-strength'; typeLabel=tmpl.focus;}
      else if(tmpl.type==='cardio'){typeClass='tp-cardio'; typeLabel=tmpl.machine;}
      else if(tmpl.type==='conditioning'){typeClass='tp-cond'; typeLabel=tmpl.focus;}
      else if(tmpl.type==='review'){typeClass='tp-review'; typeLabel='Review';}
      else {typeClass='tp-rest'; typeLabel='Rest';}
    }
    card.innerHTML = `<div class="dow">${DOW_LABEL[d.getDay()]}</div>
      <div class="dt mono">${d.getMonth()+1}/${d.getDate()}</div>
      <div class="type ${typeClass}">${typeLabel}${deload?'<span class="deload-dot"></span>':''}</div>`;
    card.onclick = ()=>{ selectedDate = d; renderAll(); };
    strip.appendChild(card);
  }
}

/* ============================== JUMP NAV ============================== */
function populateJumpNav(){
  const selBlock = document.getElementById('selBlock');
  selBlock.innerHTML = BLOCK_RANGES.map(b=>`<option value="${b.id}">${b.label}</option>`).join('');
  const r = resolveDate(selectedDate) || {block:'block1'};
  selBlock.value = r.block;
  populateWeekDay();
  selBlock.onchange = populateWeekDay;
  document.getElementById('jumpBtn').onclick = ()=>{
    const block = selBlock.value, week = document.getElementById('selWeek').value, dayKey = document.getElementById('selDay').value;
    // find a real date matching this block/week/dayKey for logging context
    const range = BLOCK_RANGES.find(b=>b.id===block);
    let start = parseISO(range.start);
    if(block==='taper'){
      const idx = parseInt(dayKey.replace('d',''))-1;
      selectedDate = addDays(start, idx);
    } else {
      const wk = parseInt(week);
      let found=null;
      for(let i=0;i<28;i++){
        const d = addDays(start, (wk-1)*7 + i);
        if(DOW_KEYS[d.getDay()]===dayKey){ found=d; break; }
      }
      selectedDate = found || start;
    }
    renderAll();
  };
}
function populateWeekDay(){
  const block = document.getElementById('selBlock').value;
  const selWeek = document.getElementById('selWeek');
  const selDay = document.getElementById('selDay');
  if(block==='taper'){
    selWeek.innerHTML = `<option value="1">Taper week</option>`;
    selDay.innerHTML = ['d1','d2','d3','d4','d5'].map((k,i)=>`<option value="${k}">Day ${i+1} · ${DAYS.taper[k].label}</option>`).join('');
  } else {
    selWeek.innerHTML = PHASES[block].map(p=>`<option value="${p.week}">Week ${p.week}${p.phase==='deload'?' (deload)':''}</option>`).join('');
    selDay.innerHTML = ['mon','tue','wed','thu','fri','sat','sun'].map(k=>`<option value="${k}">${DOW_LABEL[DOW_KEYS.indexOf(k)]} · ${DAYS[block][k].label}</option>`).join('');
  }
}

/* ============================== RENDER: MAIN DAY VIEW ============================== */
async function renderMain(){
  const main = document.getElementById('main');
  const r = resolveDate(selectedDate);
  if(!r){ main.innerHTML = '<div class="card">Outside the current 3-month plan.</div>'; return; }
  const tmpl = dayTemplate(r.block, r.dayKey);
  const phase = phaseFor(r.block, r.week);
  const iso = toISO(selectedDate);
  const sess = await getSession(r.block, r.week, r.dayKey, iso);

  let html = '';
  const deloadBadge = phase && phase.phase==='deload' ? '<span class="badge deload">Deload</span>' : '';
  let heading = tmpl.label, subLabel = '';
  if(tmpl.type==='strength'){ heading = tmpl.focus; subLabel = tmpl.label; }
  else if(tmpl.type==='cardio'){ heading = tmpl.machine; subLabel = 'Zone 2'; }
  else if(tmpl.type==='conditioning'){ heading = tmpl.focus; subLabel = tmpl.label; }
  html += `<div class="day-banner"><h2>${heading}${deloadBadge}</h2>
    <div class="meta">${subLabel?subLabel+' · ':''}${r.blockLabel} · ${DOW_LABEL[selectedDate.getDay()]} ${selectedDate.getMonth()+1}/${selectedDate.getDate()}${phase?' · RPE target '+phase.rpe:''}</div></div>`;

  if(tmpl.type==='strength'){
    if(tmpl.hang){
      html += `<div class="warmup">Warm-up: band pull-aparts x15, bosu single-leg foot doming 2x20s/side, dead hang — ${tmpl.hang.type}${tmpl.hang.dur?`: ${tmpl.hang.sets}x${tmpl.hang.dur}s`:` (${tmpl.hang.sets} sets)`}.</div>`;
    } else {
      html += `<div class="warmup">Warm-up: band pull-aparts x15, light bodyweight movement prep.</div>`;
    }
    for(const item of tmpl.list){
      html += await renderExerciseCard(item, r, phase, sess, iso);
    }
    if(tmpl.finisher){
      html += `<div class="finisher"><b>Finisher:</b> ${tmpl.finisher}</div>`;
    }
    html += renderPainLog(sess);
  } else if(tmpl.type==='cardio'){
    html += `<div class="card zone2box"><h3>${tmpl.min} min</h3>
      <div>${tmpl.mode}</div>
      <div style="margin-top:8px;">Target heart rate: <span class="hr mono">106–124 bpm</span> (Zone 2, age 44)</div>
      <div style="margin-top:4px; color:var(--text2); font-size:12px;">5 min warm-up, main effort in range, 5 min cool-down.</div></div>`;
  } else if(tmpl.type==='conditioning'){
    html += await renderConditioning(tmpl, r, sess, iso);
    html += renderPainLog(sess);
  } else if(tmpl.type==='review'){
    html += `<div class="card review"><h3>Block Review</h3>
      <ul>
        <li>Run Data Review Protocol: RPE alignment, progression rate, stalled lifts, foot pain trend, dead hang trajectory, missed sessions</li>
        <li>Confirm current dead hang best against the 2:00 target</li>
        <li>Confirm whether Phase 2 impact tolerance supports further progression next block</li>
        <li>Revisit the calf-work question flagged in the Block 3 audit</li>
      </ul></div>`;
  } else {
    html += `<div class="card">Full rest. No training scheduled.</div>`;
  }

  main.innerHTML = html;
  wireExerciseInputs(r, phase, iso);
  wirePainLog(r, phase, iso);
  wireConditioningChecks(r, iso);
}

async function renderExerciseCard(item, r, phase, sess, iso){
  const info = EX[item.ex];
  const exState = await getExState(item.ex);
  const progressable = PROGRESSABLE.includes(info.unit);
  let repsLow = item.repsLow, repsHigh = item.repsHigh;
  if(phase && phase.phase!=='taper' && progressable){ /* main lifts follow week phase rep range */ }
  const sets = (phase && phase.phase==='deload') ? Math.max(2, item.sets-1) : item.sets;
  let targetWeight = exState.currentTarget || info.start || null;
  const rxWeight = progressable ? (targetWeight? `${targetWeight}lb target` : 'log your starting weight') : (info.unit==='time'?`${item.repsLow}s hold`:'bodyweight');

  let rows = '';
  for(let s=1;s<=sets;s++){
    const logged = (sess.exercises[item.ex] && sess.exercises[item.ex][s-1]) || {};
    rows += `<div class="setrow" data-ex="${item.ex}" data-set="${s}">
      <div class="lbl mono">${s}</div>
      <input type="number" inputmode="decimal" placeholder="${progressable?'lb':'—'}" class="wIn" value="${logged.weight??''}" ${progressable?'':'disabled'}>
      <input type="number" inputmode="numeric" placeholder="reps/${repsLow}-${repsHigh}" class="rIn" value="${logged.reps??''}">
      <input type="number" inputmode="numeric" placeholder="RPE" class="pIn" value="${logged.rpe??''}" min="1" max="10">
      <div class="check ${logged.done?'done':''}" data-role="check">${logged.done?'✓':''}</div>
    </div>`;
  }
  const cue = (progressable && exState.reason) ? `<div class="cue">${exState.reason}</div>` : '';
  return `<div class="card" data-exwrap="${item.ex}" data-rest="${item.rest}">
    <h3>${info.name}</h3>
    <div class="rx">${sets}×${repsLow===repsHigh?repsLow:repsLow+'-'+repsHigh} · rest ${item.rest}s · ${rxWeight}${phase?` · RPE ${phase.rpe}`:''}</div>
    ${rows}
    ${cue}
  </div>`;
}

function renderPainLog(sess){
  return `<div class="card"><h3>Foot &amp; Back Check</h3>
    <div class="pain"><span style="width:46px;font-size:12px;color:var(--text2)">Foot</span>
      <input type="range" id="footPain" min="0" max="10" value="${sess.footPain??0}"><span class="val mono" id="footVal">${sess.footPain??0}</span></div>
    <div class="pain"><span style="width:46px;font-size:12px;color:var(--text2)">Back</span>
      <input type="range" id="backPain" min="0" max="10" value="${sess.backPain??0}"><span class="val mono" id="backVal">${sess.backPain??0}</span></div>
    <div style="font-size:11px;color:var(--text3);margin-top:5px;">Above 4 means message before the next session, don't push through.</div>
  </div>`;
}

async function renderConditioning(tmpl, r, sess, iso){
  const clean = await blockFootDataClean(tmpl.gateBlock);
  let badge, exList, note;
  if(clean===true){
    badge = '<span class="badge unlocked">Impact unlocked</span>';
    exList = tmpl.impact.concat(tmpl.base.filter(e=>e!=='bosu_stepup'));
    note = tmpl.gateBlock==='block1'
      ? 'Phase 1 reintroduction is live: low step-ups with controlled landings + pogo hops, based on clean foot pain data from Block 1.'
      : 'Phase 2 reintroduction is live: single-leg hops + broad jump landings, based on clean foot pain data from Block 2.';
  } else if(clean===false){
    badge = '<span class="badge gated">Impact gated</span>';
    exList = tmpl.base;
    note = `Foot pain logged above 2 during ${tmpl.gateBlock==='block1'?'Block 1':'Block 2'} strength days. Staying on the non-impact circuit until a clean stretch shows up.`;
  } else {
    badge = '<span class="badge gated">Impact gated — no data yet</span>';
    exList = tmpl.base;
    note = `No foot pain data logged yet for ${tmpl.gateBlock==='block1'?'Block 1':'Block 2'} strength days. Defaulting to the non-impact circuit until that's on record.`;
  }
  let rows = exList.map(id=>`<li>${EX[id].name}</li>`).join('');
  return `<div class="card"><h3>Conditioning ${badge}</h3>
    <div class="rx">${tmpl.rounds} rounds, rest ${tmpl.restRounds}s between rounds</div>
    <ol style="margin:8px 0 0 18px; padding:0; font-size:13px; color:var(--text2); line-height:1.7;">${rows}</ol>
    <div class="cue" style="margin-top:10px;">${note}</div>
    <div style="margin-top:10px;">
      <label style="font-size:12px;color:var(--text2);">Rounds completed</label><br>
      <input type="number" id="roundsDone" inputmode="numeric" value="${sess.roundsDone??''}" style="width:70px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px;margin-top:4px;">
    </div>
  </div>`;
}

/* ============================== WIRING ============================== */
function wireExerciseInputs(r, phase, iso){
  document.querySelectorAll('.setrow').forEach(row=>{
    const exId = row.dataset.ex, setNum = parseInt(row.dataset.set);
    const wIn = row.querySelector('.wIn'), rIn = row.querySelector('.rIn'), pIn = row.querySelector('.pIn');
    const check = row.querySelector('[data-role=check]');
    check.onclick = async ()=>{
      const done = !check.classList.contains('done');
      check.classList.toggle('done', done);
      check.textContent = done? '✓' : '';
      const sess = await getSession(r.block, r.week, r.dayKey, iso);
      sess.exercises[exId] = sess.exercises[exId] || [];
      sess.exercises[exId][setNum-1] = {
        weight: wIn.value?parseFloat(wIn.value):null,
        reps: rIn.value?parseFloat(rIn.value):null,
        rpe: pIn.value?parseFloat(pIn.value):null,
        done
      };
      await saveSession(r.block, r.week, r.dayKey, iso, sess);
      if(done){
        const restSec = parseInt(row.closest('.card').dataset.rest) || 60;
        startTimer(restSec, 'REST', `${EX[exId].name} · set ${setNum} · ${restSec}s`);
        if(PROGRESSABLE.includes(EX[exId].unit) && wIn.value && rIn.value && pIn.value){
          const {reason} = await logSet(exId, r.block, r.week, parseFloat(wIn.value), parseFloat(rIn.value), parseFloat(pIn.value));
          const wrap = document.querySelector(`[data-exwrap="${exId}"]`);
          let cue = wrap.querySelector('.cue');
          if(!cue){ cue = document.createElement('div'); cue.className='cue'; wrap.appendChild(cue); }
          cue.textContent = reason;
        }
      }
    };
  });
}

function wirePainLog(r, phase, iso){
  const foot = document.getElementById('footPain'), back = document.getElementById('backPain');
  if(!foot) return;
  const footVal = document.getElementById('footVal'), backVal = document.getElementById('backVal');
  const save = async ()=>{
    const sess = await getSession(r.block, r.week, r.dayKey, iso);
    sess.footPain = parseInt(foot.value); sess.backPain = parseInt(back.value);
    await saveSession(r.block, r.week, r.dayKey, iso, sess);
  };
  foot.oninput = ()=>{ footVal.textContent = foot.value; save(); };
  back.oninput = ()=>{ backVal.textContent = back.value; save(); };
}

function wireConditioningChecks(r, iso){
  const rd = document.getElementById('roundsDone');
  if(!rd) return;
  rd.onchange = async ()=>{
    const sess = await getSession(r.block, r.week, r.dayKey, iso);
    sess.roundsDone = rd.value?parseInt(rd.value):null;
    await saveSession(r.block, r.week, r.dayKey, iso, sess);
  };
}

/* ============================== TIMER ============================== */
let timerInterval=null, timerRemaining=0, timerRunning=false;
const timerDisplay = ()=>document.getElementById('timerDisplay');
const timerBar = ()=>document.getElementById('timerbar');
const timerMode = ()=>document.getElementById('timerMode');
const timerCtx = ()=>document.getElementById('timerCtx');

function fmt(s){ const m=Math.floor(s/60), sec=s%60; return `${m}:${sec<10?'0':''}${sec}`; }

function startTimer(seconds, mode, ctx){
  clearInterval(timerInterval);
  timerRemaining = seconds; timerRunning = true;
  timerBar().classList.remove('ringing');
  timerMode().textContent = mode; timerCtx().textContent = ctx || '';
  timerDisplay().textContent = fmt(timerRemaining);
  timerInterval = setInterval(()=>{
    if(!timerRunning) return;
    timerRemaining--;
    if(timerRemaining<=0){
      clearInterval(timerInterval);
      timerDisplay().textContent = '0:00';
      timerBar().classList.add('ringing');
      timerMode().textContent = 'TIME';
      ringAlert();
      timerRunning=false;
      return;
    }
    timerDisplay().textContent = fmt(timerRemaining);
  },1000);
}

function ringAlert(){
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]); }catch(e){}
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime+0.02);
    o.start();
    o.stop(ctx.currentTime+0.9);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.85);
  }catch(e){}
}

function wireTimer(){
  document.getElementById('chipRest').onclick = ()=>startTimer(90,'REST','Manual rest');
  document.querySelectorAll('.chip[data-s]').forEach(c=>{
    c.onclick = ()=>startTimer(parseInt(c.dataset.s), 'TRANSITION', 'Moving to next station');
  });
  document.getElementById('chipPause').onclick = (e)=>{
    timerRunning = !timerRunning;
    e.target.textContent = timerRunning? 'Pause':'Resume';
  };
  document.getElementById('chipReset').onclick = ()=>{
    clearInterval(timerInterval); timerRunning=false; timerRemaining=0;
    timerDisplay().textContent='0:00'; timerMode().textContent='IDLE'; timerCtx().textContent='Tap a chip to start';
    timerBar().classList.remove('ringing');
    document.getElementById('chipPause').textContent='Pause';
  };
}

/* ============================== CSV EXPORT ============================== */
async function exportCSV(){
  const rows = [['date','block','week','day','exercise','set','prescribed_reps_low','prescribed_reps_high','rest_s','rpe_target','weight','reps','rpe','done','foot_pain','back_pain']];
  const start = parseISO('2026-07-02'), end = parseISO('2026-09-28');
  for(let d=new Date(start); d<=end; d=addDays(d,1)){
    const r = resolveDate(d);
    if(!r) continue;
    const tmpl = dayTemplate(r.block, r.dayKey);
    if(tmpl.type!=='strength' && tmpl.type!=='conditioning') continue;
    const iso = toISO(d);
    const sess = await sget(sessionKey(r.block, r.week, r.dayKey, iso));
    if(!sess) continue;
    const phase = phaseFor(r.block, r.week);
    if(tmpl.type==='strength'){
      for(const item of tmpl.list){
        const logs = sess.exercises[item.ex] || [];
        logs.forEach((l,i)=>{
          if(!l) return;
          rows.push([iso, r.block, r.week, r.dayKey, EX[item.ex].name, i+1, item.repsLow, item.repsHigh, item.rest, phase?phase.rpe:'', l.weight??'', l.reps??'', l.rpe??'', l.done?1:0, sess.footPain??'', sess.backPain??'']);
        });
      }
    } else if(tmpl.type==='conditioning'){
      rows.push([iso, r.block, r.week, r.dayKey, 'Conditioning rounds', '', '', '', '', '', '', sess.roundsDone??'', '', '', sess.footPain??'', sess.backPain??'']);
    }
  }
  const csv = rows.map(row=>row.map(v=>{
    const s = String(v??''); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `training-log-${toISO(new Date())}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

  document.getElementById('todayLabel').textContent = new Date().toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});
  await renderStrip();

}

document.getElementById('exportBtn').onclick = exportCSV;
